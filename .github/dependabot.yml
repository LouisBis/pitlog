version: 2

updates:
  - package-ecosystem: npm
    directory: /client
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      react-ecosystem:
        patterns: ["react", "react-dom", "@tanstack/*", "@dnd-kit/*"]
      vite:
        patterns: ["vite", "@vitejs/*", "vite-*"]
      testing:
        patterns: ["vitest", "msw", "@testing-library/*", "playwright", "@playwright/*"]
      types:
        patterns: ["@types/*"]

  - package-ecosystem: npm
    directory: /server
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      server-deps:
        patterns: ["express", "pino", "better-sqlite3", "zod", "supertest"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
