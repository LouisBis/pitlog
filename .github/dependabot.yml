version: 2

updates:
  - package-ecosystem: npm
    directory: /client
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      react-ecosystem:
        patterns: ["react", "react-dom", "react-*", "@tanstack/*", "@dnd-kit/*", "framer-motion", "i18next", "@radix-ui/*", "@phosphor-icons/*"]
      vite:
        patterns: ["vite", "@vitejs/*", "vite-*"]
      testing:
        patterns: ["vitest", "msw", "@testing-library/*", "playwright", "@playwright/*", "chromatic", "@chromatic-com/*"]
      linting:
        patterns: ["eslint", "eslint-*", "typescript-eslint", "globals", "prettier"]
      types:
        patterns: ["@types/*"]

  - package-ecosystem: npm
    directory: /server
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      server-deps:
        patterns: ["express", "pino", "better-sqlite3", "zod", "supertest", "drizzle-*"]
      server-devdeps:
        patterns: ["@types/*", "vitest", "tsx", "nodemon", "prettier"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
