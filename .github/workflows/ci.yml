name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  lint-client:
    name: Lint — client (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client
      - name: Run ESLint
        run: npm run lint
        working-directory: client

  typecheck-client:
    name: Typecheck — client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client
      - name: Run tsc
        run: npx tsc --noEmit
        working-directory: client

  typecheck-server:
    name: Typecheck — server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: server
      - name: Run tsc
        run: npx tsc --noEmit
        working-directory: server

  test-client:
    name: Test — client (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client
      - name: Run tests
        run: npm test
        working-directory: client

  test-server:
    name: Test — server (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: server
      - name: Run tests
        run: npm test
        working-directory: server

  validate-catalog:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog JSON files
        run: node scripts/validate-catalog.mjs

  docker-health:
    name: Docker health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create env files
        run: |
          cp server/.env.example server/.env
          cp client/.env.example client/.env
      - name: Build and start containers
        run: docker compose up -d --build
      - name: Wait for server health
        run: timeout 60 bash -c 'until curl -sf http://localhost:3001/health; do sleep 2; done'
      - name: Tear down
        if: always()
        run: docker compose down

  build-pages:
    name: Build + smoke (GitHub Pages)
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client
      - name: Build for GitHub Pages
        run: npm run build -- --base /pitlog/
        working-directory: client
        env:
          VITE_USE_MOCKS: 'true'
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Run smoke tests
        run: npx playwright test
        working-directory: client

  chromatic:
    name: Visual regression (Chromatic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client
      - name: Build for visual tests
        run: npm run build -- --base /pitlog/
        working-directory: client
        env:
          VITE_USE_MOCKS: 'true'
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Capture snapshots (Playwright)
        run: npx playwright test e2e/visual.spec.ts
        working-directory: client
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: client/e2e/screenshots/
          retention-days: 3
      - name: Upload to Chromatic
        # Auto-accept on dev/main (new baseline); exit 1 on feature branches to force review
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm run test:visual -- --auto-accept-changes
          else
            npm run test:visual
          fi
        working-directory: client
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  check-version-tag:
    name: Version not yet tagged
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - name: Fail if tag already exists
        run: |
          VERSION=$(node -p "require('./client/package.json').version")
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "❌ Tag v$VERSION already exists — bump the version before merging to main."
            exit 1
          fi
          echo "✅ v$VERSION is untagged, good to merge."

  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Enforce dev → main only
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "❌ Only 'dev' can merge into 'main'. Got: '${{ github.head_ref }}'"
            exit 1
          fi
          echo "✅ Source branch is 'dev' — allowed."
